<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Artiste | Gentle Leak</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; margin: 0; padding: 0; overflow-x: hidden; }
  </style>
  <link rel="shortcut icon" href="/assets/images/logo-head.webp" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/others/Style.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    body {
      background: #000;
      color: #fff;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    
    /* === MOBILE FIRST (par défaut pour petit écran) === */
    .artist-header {
      max-width: 100%;
      margin: 0.8rem 0 0;
      padding: 0 0.5rem;
      width: 100%;
    }
    
    .artist-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 0.3rem;
      letter-spacing: -0.5px;
    }
    
    .artist-header h1 span { color: #ff9000; }
    
    .artist-header p {
      color: #999;
      font-size: 12px;
      margin: 0 0 0.8rem;
      font-weight: 500;
    }
    
    #videosGrid {
      max-width: 100%;
      margin: 0 auto 1.5rem;
      padding: 0 0.25rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }
    
    .video-card {
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .video-card:hover {
      border-color: #ff9000;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 144, 0, 0.15);
    }
    
    .video-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #ff9000;
      transform: scaleX(0);
      transition: transform 0.3s;
    }
    
    .video-card:hover::before { transform: scaleX(1); }
    
    .video-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      border-radius: 0;
      margin-bottom: 0;
      transition: transform 0.3s;
    }
    
    .video-card:hover img { transform: scale(1.02); }
    
    .video-card h3 {
      font-size: 11px;
      font-weight: 600;
      margin: 6px 6px 2px;
      color: #fff;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }
    
    .video-card .meta {
      font-size: 10px;
      color: #999;
      padding: 0 6px 6px;
      font-weight: 400;
    }
    
    #status {
      max-width: 100%;
      margin: 1rem auto;
      text-align: center;
      color: #666;
      width: 100%;
      font-size: 13px;
    }
    
    #searchWrap {
      max-width: 100%;
      margin: 0 auto 0.8rem;
      padding: 0 0.5rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      flex-direction: column;
      width: 100%;
    }
    
    #searchWrap input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      transition: all 0.2s;
      width: 100%;
    }
    
    #searchWrap input:focus {
      outline: none;
      border-color: #ff9000;
      box-shadow: 0 0 0 3px rgba(255, 144, 0, 0.1);
    }
    
    #searchWrap input::placeholder { color: #666; }
    
    #searchWrap select {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
      transition: all 0.2s;
    }
    
    #searchWrap select:focus {
      outline: none;
      border-color: #ff9000;
      box-shadow: 0 0 0 3px rgba(255, 144, 0, 0.1);
    }
    
    /* === TABLETTE (600px+) === */
    @media (min-width: 600px) {
      .artist-header {
        margin: 1.2rem 0 0;
        padding: 0 0.75rem;
      }
      
      .artist-header h1 {
        font-size: 22px;
      }
      
      .artist-header p {
        font-size: 13px;
        margin: 0 0 1rem;
      }
      
      #videosGrid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 0 0.5rem;
        margin: 0 auto 2rem;
      }
      
      .video-card h3 {
        font-size: 12px;
        margin: 8px 8px 4px;
      }
      
      .video-card .meta {
        font-size: 11px;
        padding: 0 8px 8px;
      }
      
      #searchWrap {
        flex-direction: row;
        padding: 0 0.75rem;
        gap: 0.5rem;
        margin: 0 auto 1.2rem;
      }
      
      #searchWrap input {
        padding: 10px 12px;
        font-size: 13px;
        min-width: 200px;
        width: auto;
        flex: 1;
      }
      
      #searchWrap select {
        padding: 10px 12px;
        font-size: 13px;
        width: auto;
        min-width: 180px;
      }
    }
    
    /* === DESKTOP (768px+) === */
    @media (min-width: 768px) {
      .artist-header {
        margin: 1.5rem 0 0;
        padding: 0 1rem;
      }
      
      .artist-header h1 {
        font-size: 28px;
      }
      
      .artist-header p {
        font-size: 14px;
        margin: 0 0 1.5rem;
      }
      
      #videosGrid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
        padding: 0 1rem;
        margin: 0 auto 3rem;
      }
      
      .video-card {
        border-radius: 6px;
      }
      
      .video-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(255, 144, 0, 0.2);
      }
      
      .video-card img {
        aspect-ratio: 16/9;
      }
      
      .video-card:hover img {
        transform: scale(1.05);
      }
      
      .video-card h3 {
        font-size: 14px;
        margin: 12px 12px 6px;
        overflow: visible;
        text-overflow: clip;
        display: block;
        -webkit-line-clamp: unset;
      }
      
      .video-card .meta {
        font-size: 12px;
        padding: 0 12px 12px;
      }
      
      #status {
        margin: 2rem auto;
        font-size: 16px;
      }
      
      #searchWrap {
        flex-direction: row;
        padding: 0 1rem;
        gap: 0.75rem;
        margin: 0 auto 1.5rem;
      }
      
      #searchWrap input {
        padding: 12px 16px;
        font-size: 14px;
        min-width: 150px;
        width: auto;
        flex: 1;
      }
      
      #searchWrap select {
        padding: 12px 12px;
        font-size: 14px;
        min-width: 190px;
        width: auto;
      }
    }
  </style>
</head>
<body class="bg-dark text-light" style="width: 100%; max-width: 100%; margin: 0; padding: 0; overflow-x: hidden;">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="width: 100%; max-width: 100%;">
    <a class="navbar-brand">Gentle <span style="color:#ff9000">Leak</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/bibliothèque.html">Bibliothèque</a></li>
      </ul>
    </div>
  </nav>

  <div id="status">Chargement...</div>
  <div class="artist-header d-none" id="artistHeader">
    <h1 id="artistName"></h1>
    <p id="artistCount"></p>
  </div>
  <div id="searchWrap" class="d-none">
    <input type="text" id="searchInput" placeholder="🔍 Rechercher parmi les vidéos..." />
    <select id="sortSelect" aria-label="Trier les vidéos">
      <option value="date_desc" selected>📅 Date (récent → ancien)</option>
      <option value="date_asc">📅 Date (ancien → récent)</option>
      <option value="title_asc">🔠 Titre (A → Z)</option>
      <option value="title_desc">🔡 Titre (Z → A)</option>
    </select>
  </div>
  <div id="videosGrid"></div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
  <script src="/assets/js/artist.js" defer></script>
</body>
</html>
